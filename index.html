<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Identity Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-styling@1.6.0"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-xl bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Hybrid Identity Generator</h1>
        <form id="identityForm" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                <input type="text" id="name" name="name" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                <input type="tel" id="phone" name="phone"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="org" class="block text-sm font-medium text-gray-700 mb-1">Organization</label>
                <input type="text" id="org" name="org"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Generate QR Code
            </button>
        </form>
        <div id="qrCodeContainer" class="mt-8 flex justify-center items-center min-h-[200px]"></div>
    </div>

    <script>
        const form = document.getElementById('identityForm');
        const qrContainer = document.getElementById('qrCodeContainer');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            const identity = {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                org: formData.get('org')
            };
            
            // Clear previous QR code
            qrContainer.innerHTML = '';
            
            // Create QR code
            const qrCode = new QRCodeStyling({
                width: 200,
                height: 200,
                type: 'svg',
                data: JSON.stringify(identity, null, 2),
                image: undefined,
                margin: 0,
                qrOptions: {
                    errorCorrectionLevel: 'M'
                },
                imageOptions: {
                    crossOrigin: "anonymous",
                    margin: 0
                }
            });
            
            qrCode.append(qrContainer);
        });
    </script>
</body>
</html>
